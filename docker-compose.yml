version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ynr_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ynr_secure_prod_password
      POSTGRES_DB: ynr_happy_homes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ynr_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:ynr_secure_prod_password@postgres:5432/ynr_happy_homes?schema=public
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      JWT_SECRET: ynr-happy-homes-production-super-secret-jwt-key-2026
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/backend/uploads

volumes:
  postgres_data:
  uploads_data:
