# Render Blueprint Infrastructure-as-Code Specification for YNR Happy Homes
# Defines Full-Stack Render Infrastructure: Database, Backend API, and Frontend SPA

services:
  - type: web
    name: ynr-happy-homes-backend
    env: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm run db:seed && node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ynr-happy-homes-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: FRONTEND_URL
        value: https://ynr-happy-homes-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://ynr-happy-homes-frontend.onrender.com,https://www.ynrhappyhomes.com
      - key: BASE_URL
        sync: false

  - type: static
    name: ynr-happy-homes-frontend
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ynr-happy-homes-backend.onrender.com/api/v1

databases:
  - name: ynr-happy-homes-db
    databaseName: ynr_happy_homes
    user: ynr_admin
    region: oregon
    plan: starter
